<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mother 3 Online</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #111;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; padding: 20px;
        }
        h1 { font-size: 18px; color: #e53935; text-align: center; margin-bottom: 20px; }
        .game-wrapper {
            width: 800px; max-width: 100%; background: #000;
            padding: 12px; border: 4px solid #e53935;
        }
        #game-container {
            width: 100%; height: 550px; position: relative;
            background: #000; display: flex; align-items: center; justify-content: center;
        }
        #game { width: 100%; height: 100%; }
        .play-btn {
            position: absolute; z-index: 99; padding: 20px 40px;
            font-family: 'Press Start 2P', monospace; font-size: 16px;
            color: #fff; background: #e53935; border: 4px solid #fff; cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>MOTHER 3</h1>
    <div class="game-wrapper">
        <div id="game-container">
            <button id="start-btn" class="play-btn" onclick="startGame()">JOGAR</button>
            <div id="game"></div>
        </div>
    </div>
    <script type="text/javascript">
        EJS_player = '#game';
        EJS_core = 'gba';
        EJS_gameName = 'Mother 3';
        EJS_color = '#e53935';
        EJS_startOnLoaded = true;
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        
        /* Aponta para o arquivo mother3.zip */
        EJS_gameUrl = 'mother3.zip';

        function startGame() {
            document.getElementById('start-btn').style.display = 'none';
            const loader = document.createElement('script');
            loader.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
            document.body.appendChild(loader);
        }
    </script>
</body>
</html>
